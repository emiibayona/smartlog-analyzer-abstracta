services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS-http://localhost:3000}"
      MONGODB_URI: mongodb://mongodb:27017/smartlog
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      MONGODB_URI: mongodb://mongodb:27017/smartlog
      API_BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
  mongodb_config:
